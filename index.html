<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Livro de Pokémons</title>
    <link rel="icon" type="imagem/svg+xml" href="pokebola.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="contaner">
      <div class="card">
        <h2 class="nome" id="nome"></h2>

        <img id="imagem" src="" alt="" />

        <p id="tipo"></p>
      </div>

      <div id="buscador" class="buscador">
        <input type="text" id="busca" placeholder="Digite o nome do Pokemon" />
        <button id="botao">Buscar</button>
      </div>

      <p id="mensagem"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
